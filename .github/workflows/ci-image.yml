name: Build CI image

on:
  push:
    branches: [main]
    paths:
      - test/headless/Dockerfile
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - test/headless/Dockerfile
      - .github/workflows/ci-image.yml
  workflow_dispatch:
  schedule:
    # Arch is a rolling release, so a stale image drifts out of date fast —
    # rebuild monthly to pick up package and (importantly) keyring updates.
    - cron: "17 4 1 * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/scottmorris/gnome-media-controls-ci
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: test/headless
          file: test/headless/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write summary
        if: always()
        run: |
          {
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "### ✅ Image build succeeded"
            else
              echo "### ❌ Image build failed"
            fi
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Validated only (build without push) -- PRs never push to GHCR."
            else
              echo "Pushed to \`ghcr.io/scottmorris/gnome-media-controls-ci\`:"
            fi
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
