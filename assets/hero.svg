<!-- Hero banner for the Media Controls README -->
<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Media Controls</title>
  <desc id="hero-desc">Hero banner for Media Controls — a GNOME Shell extension showing now-playing media in the top panel. A mock GNOME panel with a track label opens a popup with album art, a seek slider, and transport controls.</desc>

  <defs>
    <!-- Background gradient: near-black with a cool GNOME-blue tint -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="60%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0a1322"/>
    </linearGradient>

    <!-- Brand gradient: light GNOME blue into warm now-playing amber -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="45%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#ff9e4a"/>
    </linearGradient>

    <!-- Popup card background -->
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#121319"/>
    </linearGradient>

    <!-- Album-art placeholder gradient -->
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#5e5cd6"/>
    </linearGradient>

    <!-- Audio beam for the flowing wave -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3584e4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9e4a" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text glow -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Popup window shadow -->
    <filter id="win-shadow" x="-10%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00000060"/>
    </filter>

    <!-- Clip for the scrolling track label in the panel button -->
    <clipPath id="label-clip">
      <rect x="756" y="30" width="110" height="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- Ambient glow circles -->
  <g opacity="0.07">
    <circle cx="920" cy="190" r="200" fill="#3584e4"/>
    <circle cx="220" cy="70" r="150" fill="#ff9e4a"/>
    <circle cx="560" cy="280" r="160" fill="#33c7de"/>
  </g>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#3584e4" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- ═══ LEFT SIDE: TEXT CONTENT ═══ -->

  <!-- Title -->
  <text x="80" y="68" font-size="44" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" letter-spacing="-0.02em" fill="url(#brand)" filter="url(#text-glow)">Media Controls</text>

  <!-- Taglines -->
  <text x="82" y="98" fill="#b4bfce" font-size="16" font-family="'Inter', system-ui, sans-serif">Now-playing media controls in the GNOME top panel, via MPRIS</text>
  <text x="82" y="121" fill="#7c8796" font-size="13" font-family="'Inter', system-ui, sans-serif">A community-maintained revival of the archived upstream extension</text>

  <!-- Animated equaliser bars -->
  <g fill="#3584e4" opacity="0.55" filter="url(#glow)">
    <rect x="82" y="220" width="6" rx="3" height="12">
      <animate attributeName="height" values="12;24;8;12" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="220;208;224;220" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="214" width="6" rx="3" height="18" fill="#62a0ea">
      <animate attributeName="height" values="18;6;26;18" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="214;226;206;214" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="110" y="224" width="6" rx="3" height="8" fill="#33c7de">
      <animate attributeName="height" values="8;22;14;8" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="224;210;218;224" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="124" y="210" width="6" rx="3" height="22" fill="#ff9e4a">
      <animate attributeName="height" values="22;10;28;22" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;222;204;210" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="138" y="218" width="6" rx="3" height="14">
      <animate attributeName="height" values="14;26;6;14" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="218;206;226;218" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="222" width="6" rx="3" height="10" fill="#62a0ea">
      <animate attributeName="height" values="10;20;16;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="222;212;216;222" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="166" y="212" width="6" rx="3" height="20" fill="#33c7de">
      <animate attributeName="height" values="20;8;24;20" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="212;224;208;212" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="180" y="220" width="6" rx="3" height="12" fill="#ff9e4a">
      <animate attributeName="height" values="12;22;8;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="220;210;224;220" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Flowing audio wave from the equaliser toward the panel mockup -->
  <path id="wave-path" d="M200 226 C320 226 380 254 500 254 S700 232 796 204" stroke="url(#beam)" stroke-width="2" fill="none" opacity="0.35"/>
  <circle r="3.5" fill="#62a0ea" opacity="0.8" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#wave-path"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#ff9e4a" opacity="0.6">
    <animateMotion dur="6s" begin="2.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#wave-path"/>
    </animateMotion>
  </circle>

  <!-- ═══ RIGHT SIDE: GNOME PANEL + POPUP MOCKUP ═══ -->

  <!-- GNOME top panel bar -->
  <g>
    <rect x="600" y="24" width="550" height="32" rx="8" fill="#0a0c12" stroke="#ffffff14" stroke-width="1"/>
    <!-- Clock -->
    <text x="626" y="44" font-size="11" font-family="monospace" fill="#7c8796">Aug 31  10:24</text>
    <!-- System tray hints -->
    <g fill="#5c6570">
      <path d="M1096 43 a6 6 0 0 1 8 0 l-4 4 z"/>
      <rect x="1112" y="36" width="14" height="8" rx="2" fill="none" stroke="#5c6570" stroke-width="1.2"/>
      <rect x="1114" y="38" width="8" height="4" rx="1"/>
      <rect x="1127" y="38" width="2" height="4" rx="1"/>
    </g>
    <!-- Media Controls panel button: scrolling "Title - Artist" label + 5 control icons -->
    <rect x="744" y="28" width="280" height="24" rx="12" fill="#ffffff10"/>
    <g clip-path="url(#label-clip)">
      <text x="756" y="44" font-size="11" font-family="monospace" font-weight="600" fill="#f2f4f8">
        Anti-Pioneer - Feist
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; -28 0; -28 0; 0 0" keyTimes="0;0.15;0.5;0.65;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>
    <g fill="#e8ecf2">
      <!-- Seek backward (double chevron left) -->
      <path d="M896 35 L889 40 L896 45 Z"/>
      <path d="M903 35 L896 40 L903 45 Z"/>
      <!-- Previous (bar + chevron left) -->
      <rect x="912" y="35" width="2" height="10"/>
      <path d="M924 35 L916 40 L924 45 Z"/>
      <!-- Play -->
      <path d="M937 34 L947 40 L937 46 Z"/>
      <!-- Next (chevron right + bar) -->
      <path d="M958 35 L966 40 L958 45 Z"/>
      <rect x="968" y="35" width="2" height="10"/>
      <!-- Seek forward (double chevron right) -->
      <path d="M981 35 L988 40 L981 45 Z"/>
      <path d="M988 35 L995 40 L988 45 Z"/>
    </g>
  </g>

  <!-- Caret from the panel button to the popup -->
  <path d="M874 66 L884 56 L894 66 Z" fill="#181a24"/>

  <!-- Popup card (portrait, matching the real popup) -->
  <g filter="url(#win-shadow)">
    <rect x="798" y="66" width="172" height="246" rx="14" fill="url(#card-bg)" stroke="#ffffff12" stroke-width="1"/>
  </g>

  <!-- Player source row: app icon + name, centered near the top -->
  <g>
    <circle cx="862" cy="80" r="5.5" fill="#1ed760"/>
    <path d="M858.5 78.4 c2.4 -0.7 4.8 -0.4 6.6 0.7 M859 80.4 c2 -0.5 4 -0.3 5.6 0.6 M859.5 82.3 c1.6 -0.4 3.2 -0.2 4.4 0.5" stroke="#0a0c12" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <text x="872" y="84" font-size="11" font-family="'Inter', system-ui, sans-serif" fill="#e8ecf2">Spotify</text>
  </g>

  <!-- Album art spanning nearly the card width, with animated now-playing bars -->
  <g>
    <rect x="818" y="90" width="132" height="132" rx="10" fill="url(#art)"/>
    <g fill="#ffffff" opacity="0.85">
      <rect x="836" y="190" width="7" rx="2" height="18">
        <animate attributeName="height" values="18;8;22;18" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="190;200;186;190" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="850" y="182" width="7" rx="2" height="26">
        <animate attributeName="height" values="26;12;20;26" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="182;196;188;182" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="864" y="194" width="7" rx="2" height="14">
        <animate attributeName="height" values="14;24;10;14" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="194;184;198;194" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Track title (bold, centered) and "Artist / Album" subtitle -->
  <text x="884" y="238" text-anchor="middle" font-size="15" font-family="'Inter', system-ui, sans-serif" font-weight="600" fill="#e8ecf2">Anti-Pioneer</text>
  <text x="884" y="254" text-anchor="middle" font-size="11" font-family="'Inter', system-ui, sans-serif" fill="#8892a8">Feist / Metals</text>

  <!-- Time row above the seek slider -->
  <text x="818" y="270" font-size="10" font-family="monospace" fill="#c8cfda">03:42</text>
  <text x="950" y="270" text-anchor="end" font-size="10" font-family="monospace" fill="#c8cfda">05:33</text>

  <!-- Seek slider with animated progress and position handle -->
  <g>
    <line x1="818" y1="282" x2="950" y2="282" stroke="#ffffff24" stroke-width="4" stroke-linecap="round"/>
    <rect x="818" y="280" height="4" rx="2" fill="#3584e4" width="0">
      <animate attributeName="width" values="0;132" keyTimes="0;1" dur="9s" calcMode="linear" repeatCount="indefinite"/>
    </rect>
    <circle cy="282" r="5" fill="#ffffff" filter="url(#glow)" cx="818">
      <animate attributeName="cx" values="818;950" keyTimes="0;1" dur="9s" calcMode="linear" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Transport row spread across the card: loop | prev, play, next | shuffle -->
  <g>
    <!-- Loop (far left) -->
    <g stroke="#d7dde6" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M826 293.5 a6.5 6.5 0 1 1 -6 4"/>
      <path d="M817 296 L820.5 297.9 L816.5 300.5" fill="#d7dde6" stroke="none"/>
    </g>
    <!-- Previous -->
    <g fill="#d7dde6">
      <rect x="858" y="294" width="2" height="12"/>
      <path d="M870 294 L862 300 L870 306 Z"/>
    </g>
    <!-- Play (center) -->
    <path d="M879 292 L893 300 L879 308 Z" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Next -->
    <g fill="#d7dde6">
      <path d="M898 294 L906 300 L898 306 Z"/>
      <rect x="908" y="294" width="2" height="12"/>
    </g>
    <!-- Shuffle (far right) -->
    <g stroke="#d7dde6" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M936 296 C942 296 944 304 950 304"/>
      <path d="M936 304 C942 304 944 296 950 296"/>
    </g>
  </g>

  <!-- Bottom info line -->
  <text x="80" y="290" fill="#7c8796" font-size="13" font-family="monospace">
    <tspan fill="#9aa4b2">MPRIS/D-Bus</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">GNOME Shell 46&#8211;50</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">GJS</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">community fork</tspan>
  </text>
</svg>
